<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DTT | Login</title>

    <link rel="stylesheet" href="DTT.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <a href="DTT.html" class="logo">
            DTT
        </a>

        <div class="header-links">
            <a href="DTT.html">🏠 Home</a>
            <a href="order.html">
                🛒 Cart
                <span id="cartCount">0</span>
            </a>
        </div>

    </header>


    <!-- NAVIGATION -->
    <nav class="navbar">

        <a href="DTT.html">Home</a>

        <a href="products.html">Products</a>

        <a href="categories.html">
            Categories
        </a>

        <a href="deals.html">
            🔥 Deals
        </a>

        <a href="order.html">
            Order
        </a>

    </nav>


    <!-- LOGIN -->
    <section class="auth-section">

        <div class="auth-box">

            <h1>Welcome Back 👋</h1>

            <p>
                Login to your DTT account
            </p>


            <form id="loginForm">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit"
                        class="auth-button">
                    LOGIN
                </button>

            </form>


            <div id="loginMessage"></div>


            <p class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>

        <h2>DTT</h2>

        <p>
            Your one-stop online store.
        </p>

    </footer>


    <script src="DTT.js"></script>

</body>

</html>
